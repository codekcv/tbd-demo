name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are cancelled. Keeping the pipeline fast is one of the rules this
# repository exists to demonstrate, so it is enforced here rather than assumed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # NEXT_PUBLIC_* is inlined at build time and ships to the browser anyway, so this
      # is a repository variable rather than a secret. It points at the dev deployment;
      # give CI its own deployment if the tests ever start writing data.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}

      # Deliberately not cached. Caching the browser saved about 30 seconds and left
      # the system-dependency install on a separate path, which hung on apt and burned
      # the whole 10 minute budget. One unconditional install is slower and reliable.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
